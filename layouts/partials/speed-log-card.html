<article class="speed-log-entry timeline-item">
  <div class="timeline-marker">
    <span class="timeline-dot"></span>
    <span class="timeline-date">{{ .Date.Format "2006-01-02" }}</span>
  </div>

  <div class="timeline-content">
    <div class="log-header">
      <span class="log-badge">{{ .Section }}</span>
      <h3 class="log-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    </div>

    <div class="log-metrics-bar">
      <span class="metric-chip latency">⚡ 延迟: {{ with .Params.latency }}{{ . }}{{ else }}35~55ms{{ end }}</span>
      <span class="metric-chip speed">🚀 吞吐: {{ with .Params.speed }}{{ . }}{{ else }}450Mbps+{{ end }}</span>
      <span class="metric-chip packet-loss">🛡️ 丢包: 0.0%</span>
    </div>

    <p class="log-summary">{{ .Summary }}</p>

    <div class="log-footer">
      <span class="read-time">⏱️ 预计阅读 {{ .ReadingTime }} 分钟</span>
      <a href="{{ .RelPermalink }}" class="read-more-link">查看完整测速日记 &rarr;</a>
    </div>
  </div>
</article>
